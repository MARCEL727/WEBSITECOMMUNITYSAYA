<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COMMUNITY</title>
    <meta name="description" content="Profil COMMUNITY." />
    <meta name="theme-color" content="#0b0e0d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b8ff62'/%3E%3Cpath d='M20 19h24v7H28v5h12v7H28v7h16v7H20z' fill='%230b0e0d'/%3E%3C/svg%3E" />
    <style>
      :root { --bg:#0b0e0d; --panel:#121716; --panel-light:#1a201d; --line:rgba(218,255,196,.15); --text:#f0f3e9; --muted:#89948a; --acid:#b8ff62; --acid-soft:#d9ffab; }
      * { box-sizing:border-box; }
      html,body { min-height:100%; }
      body { display:grid; place-items:center; min-height:100vh; margin:0; overflow:hidden; color:var(--text); background:radial-gradient(circle at 14% 15%,rgba(184,255,98,.09),transparent 27rem),radial-gradient(circle at 87% 90%,rgba(82,144,110,.12),transparent 30rem),var(--bg); font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
      body::before { position:fixed; inset:0; pointer-events:none; content:""; opacity:.22; background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:36px 36px; mask-image:linear-gradient(to bottom,black,transparent 82%); }
      .profile { position:relative; width:min(680px,calc(100% - 36px)); padding:1px; background:linear-gradient(135deg,rgba(184,255,98,.7),rgba(184,255,98,.06) 45%,rgba(184,255,98,.25)); box-shadow:0 28px 90px rgba(0,0,0,.45); }
      .profile::before,.profile::after { position:absolute; width:7px; height:7px; content:""; background:var(--acid); }
      .profile::before { top:-3px; left:-3px; } .profile::after { right:-3px; bottom:-3px; }
      .profile-card { position:relative; padding:clamp(28px,6vw,64px); background:var(--panel); }
      .profile-card::after { position:absolute; right:28px; top:28px; width:48px; height:48px; content:""; border-top:1px solid var(--acid); border-right:1px solid var(--acid); opacity:.7; }
      .label { margin:0; color:var(--acid); font-size:12px; font-weight:700; letter-spacing:.18em; }
      .profile-title { display:flex; align-items:baseline; gap:15px; margin:24px 0 45px; }
      .profile-title h1 { margin:0; color:var(--text); font-size:clamp(42px,10vw,76px); font-weight:400; letter-spacing:-.09em; line-height:.9; }
      .profile-title h1::after { display:inline-block; width:9px; height:9px; margin-left:12px; content:""; background:var(--acid); border-radius:50%; box-shadow:0 0 18px var(--acid); }
      .name-row { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
      .name-row strong { color:var(--acid-soft); font-size:clamp(19px,4vw,30px); font-weight:400; letter-spacing:.08em; }
      .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:34px; background:var(--line); border:1px solid var(--line); }
      .stat { min-width:0; padding:18px 15px 19px; background:var(--panel-light); }
      .stat span { display:block; margin-bottom:12px; overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
      .stat strong { display:block; overflow:hidden; color:var(--text); font-size:clamp(13px,2.5vw,18px); font-weight:400; letter-spacing:-.04em; text-overflow:ellipsis; white-space:nowrap; }
      .stat:first-child strong,.stat:last-child strong { color:var(--acid); }
      @media (max-width:560px) { .profile-card { padding:30px 23px 25px; } .profile-card::after { right:18px; top:18px; width:32px; height:32px; } .profile-title { margin-bottom:34px; } .name-row { align-items:flex-start; flex-direction:column; gap:9px; } .stats { grid-template-columns:repeat(2,1fr); } .stat { padding:15px 12px; } }
    </style>
  </head>
  <body>
    <main class="profile" aria-label="Profil COMMUNITY">
      <section class="profile-card">
        <p class="label">PROFIL:</p>
        <div class="profile-title"><h1>ada</h1></div>
        <div class="name-row"><span class="label">NAMA:</span><strong>COMMUNITY</strong></div>
        <div class="stats">
          <div class="stat"><span>[Fps]</span><strong id="fps">--</strong></div>
          <div class="stat"><span>[Negara]</span><strong id="country">--</strong></div>
          <div class="stat"><span>[Baterai]</span><strong id="battery">--</strong></div>
          <div class="stat"><span>[Waktu/jam]</span><strong id="clock">--:--:--</strong></div>
        </div>
      </section>
    </main>
    <script>
      (() => {
        const fps = document.getElementById("fps");
        const country = document.getElementById("country");
        const battery = document.getElementById("battery");
        const clock = document.getElementById("clock");
        const names = { ID:"Indonesia", US:"USA", GB:"UK", SG:"Singapore", MY:"Malaysia", AU:"Australia", JP:"Japan", KR:"Korea", IN:"India", DE:"Germany", FR:"France", NL:"Netherlands" };
        const locale = navigator.language || "id-ID";
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        const timeZoneCountries = { "Asia/Jakarta":"Indonesia", "Asia/Makassar":"Indonesia", "Asia/Jayapura":"Indonesia", "Asia/Singapore":"Singapore", "Asia/Kuala_Lumpur":"Malaysia", "Asia/Tokyo":"Japan", "Asia/Seoul":"Korea", "Australia/Sydney":"Australia", "Europe/London":"UK", "Europe/Paris":"France", "Europe/Berlin":"Germany" };
        const region = locale.match(/[-_]([A-Z]{2})$/i)?.[1]?.toUpperCase();
        country.textContent = timeZoneCountries[timeZone] || names[region] || region || "—";
        const updateClock = () => { clock.textContent = new Intl.DateTimeFormat(locale, { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }).format(new Date()); };
        updateClock();
        setInterval(updateClock, 1000);
        if ("getBattery" in navigator) navigator.getBattery().then((deviceBattery) => {
          const updateBattery = () => { battery.textContent = `${Math.round(deviceBattery.level * 100)}%`; };
          updateBattery();
          deviceBattery.addEventListener("levelchange", updateBattery);
        }).catch(() => { battery.textContent = "—"; });
        else battery.textContent = "—";
        let frames = 0;
        let last = performance.now();
        const measure = (time) => {
          frames++;
          if (time - last >= 1000) { fps.textContent = `${Math.round(frames * 1000 / (time - last))} FPS`; frames = 0; last = time; }
          requestAnimationFrame(measure);
        };
        requestAnimationFrame(measure);
      })();
    </script>
  </body>
</html>
